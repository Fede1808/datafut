# Semaforo: ¿FotMob responde desde un runner de GitHub?
#
# Todo lo que se midio de FotMob salio de una IP residencial argentina. Los
# runners salen por IPs de datacenter de Azure, que son las primeras que estos
# servicios bloquean. Si desde aca da 403, no sirve de nada tener el pipeline
# escrito: la actualizacion automatica no va a funcionar nunca.
#
# Por eso este workflow existe antes que el codigo de ingesta. Es descartable:
# una vez que responde la pregunta, se borra.
name: semaforo fotmob

on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir la liga argentina (un solo request)
        run: |
          echo "--- IP de salida del runner ---"
          curl -s https://api.ipify.org || echo "(no se pudo obtener)"
          echo ""

          echo "--- FotMob: leagues?id=112 ---"
          codigo=$(curl -s -o cuerpo.json -w "%{http_code}" \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36" \
            "https://www.fotmob.com/api/data/leagues?id=112")

          echo "HTTP $codigo"
          echo "bytes: $(wc -c < cuerpo.json)"
          echo "--- primeros 300 caracteres ---"
          head -c 300 cuerpo.json
          echo ""

          if [ "$codigo" != "200" ]; then
            echo "SEMAFORO EN ROJO: FotMob no responde desde el runner."
            exit 1
          fi
          echo "SEMAFORO EN VERDE: responde 200 desde Azure."
