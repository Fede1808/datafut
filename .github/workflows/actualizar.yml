# Actualiza el sitio despues de cada fecha, sin que nadie toque nada.
#
# Esto ES la definicion de terminado de la v1:
#   "termina una fecha y, sin que yo toque nada, el sitio muestra las
#    probabilidades actualizadas de todos los equipos de la liga"
#
# Como funciona:
#   1. baja los resultados nuevos
#   2. reentrena el modelo y vuelve a simular el torneo
#   3. escribe los JSON del sitio
#   4. si algo cambio, commitea y pushea
#   5. Vercel ve el push y reconstruye el sitio solo
#
# El paso 4 tiene un efecto lateral valioso: como cada actualizacion queda en
# el historial de git, con el tiempo vas a tener el registro completo de lo
# que el modelo predijo en cada momento. Eso es lo que despues permite mostrar
# que tan bien viene acertando, sin tener que guardar nada aparte.

name: Actualizar probabilidades

on:
  schedule:
    # Lunes 12:00 UTC (9:00 en Argentina). Para cuando se corre, la fecha del
    # fin de semana ya termino y football-data.co.uk publico los resultados.
    - cron: "0 12 * * 1"
  # Permite dispararlo a mano desde la pestaña Actions de GitHub, que sirve
  # para probar y para cuando se juega entre semana.
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # data/ esta en .gitignore, asi que el runner arranca SIN los JSON de
      # FotMob que ya bajamos. Sin este cache, cada corrida semanal volveria a
      # bajar la temporada entera (270+ pedidos, ~7 minutos) para conseguir los
      # 15 partidos nuevos de la fecha. Con el cache son 15 pedidos y ~20s.
      #
      # No es solo velocidad: bajar 270 partidos por semana contra 15 es
      # multiplicar por veinte la huella que dejamos en una fuente cuyos
      # Terminos de Uso ya estamos estirando. El cache es lo que hace que el
      # "incremental por diseño" de ingest_stats.py valga tambien en el CI.
      #
      # La clave lleva el run_id porque las entradas de cache son inmutables:
      # con una clave fija nunca se guardarian los partidos nuevos. El patron
      # es "restaurar la ultima que haya (restore-keys) y guardar una nueva".
      #
      # Limitacion conocida, y no la tapo: GitHub borra los caches que no se
      # usan en 7 dias, y este workflow corre justo cada 7. Si alguna semana se
      # cae el cache, la corrida siguiente vuelve a bajar todo. Es mas lenta,
      # no esta rota: los datos son regenerables y el pipeline no depende de
      # que el cache exista.
      - name: Cachear los JSON crudos de FotMob
        uses: actions/cache@v4
        with:
          path: data/raw/fotmob
          key: fotmob-raw-${{ github.run_id }}
          restore-keys: fotmob-raw-

      - name: Bajar resultados y fixture
        run: python src/ingest.py

      # Los dos pasos de FotMob son continue-on-error A PROPOSITO.
      #
      # El criterio de terminado de la v1 es que el sitio muestre las
      # probabilidades actualizadas, y esas salen del Dixon-Coles entrenado con
      # football-data.co.uk. Las estadisticas avanzadas son una capa adicional.
      # Si FotMob nos bloquea o cambia la API, lo correcto es que el sitio se
      # actualice igual con datos de xG viejos, no que deje de actualizarse.
      # El paso queda marcado en amarillo en la pestaña Actions, asi que el
      # problema se ve; simplemente no arrastra al resto del pipeline.
      - name: Bajar estadisticas avanzadas (FotMob)
        continue-on-error: true
        run: python src/ingest_stats.py

      # El calendario de lo que falta jugar. A diferencia de las estadisticas,
      # esto NO se cachea por diseño: un partido pendiente se reprograma, le
      # cambian el horario o se suspende, asi que se baja fresco siempre (ver
      # el docstring de ingest_fixture.py).
      #
      # Aun asi el paso es continue-on-error, y no se contradice con lo de
      # arriba: el archivo cae adentro de data/raw/fotmob, que este workflow ya
      # cachea por los partidos jugados. Si FotMob no contesta, queda el
      # calendario de la semana pasada — viejo, pero es el mismo torneo y los
      # equipos que se enfrentan no cambian. Mejor eso que no actualizar el
      # sitio. Si tampoco hay cache, el paso siguiente corta el pipeline.
      - name: Bajar el fixture (FotMob)
        continue-on-error: true
        run: python src/ingest_fixture.py

      - name: Normalizar
        run: python src/clean.py

      # Corre aunque el paso anterior haya fallado: clean_stats.py trabaja
      # sobre lo que haya en disco, asi que con el cache restaurado sigue
      # produciendo el CSV con los partidos viejos.
      - name: Normalizar estadisticas avanzadas
        continue-on-error: true
        run: python src/clean_stats.py

      # Este SI corta el pipeline si falla, al reves que los dos de arriba. La
      # simulacion no puede correr sin el fixture: sin el no hay partidos que
      # jugar. Y un fixture a medias es peor que ninguno — la simulacion
      # repartiria menos puntos y publicaria probabilidades equivocadas sin que
      # nada se vea roto. Mejor dejar el sitio con los numeros de la semana
      # pasada.
      - name: Normalizar el fixture
        run: python src/clean_fixture.py

      - name: Diagnosticar
        run: python src/report.py

      - name: Reentrenar el modelo
        run: python src/model.py

      - name: Simular el torneo
        run: python src/simulate.py --n 10000

      - name: Escribir los JSON del sitio
        run: python src/export.py

      # Si el pipeline fallo en cualquier paso anterior, el workflow ya se
      # corto y no se commitea nada. Es a proposito: mejor dejar el sitio con
      # datos viejos que publicar datos rotos.
      - name: Commitear si cambio algo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet web/data/; then
            echo "Sin cambios en los datos, no hay nada que publicar."
            exit 0
          fi
          git add web/data/
          git commit -m "data: actualizacion automatica $(date -u +%d/%m/%Y)"
          git push
